[project]
name = "eden-api"
version = "0.1.0"
description = "EdenMatrix go HTTP API: sessions, the public context Grok reads, rulesets."
requires-python = ">=3.13,<3.14"
dependencies = [
    "eden-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.9",
]

[tool.uv.sources]
eden-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
