[project]
name = "eden-core"
version = "0.1.0"
description = "Shared pieces of the EdenMatrix go backend: settings, database pool, queue, URLs, spend caps."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eden_core"]
