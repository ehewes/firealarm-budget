# The web app, added to the stack once apps/web exists (the deploy sets WEB_ENABLED).
# Until then Caddy answers non-API paths with a short "not deployed yet" message.
services:
  web:
    image: ghcr.io/ehewes/firealarm-budget-web:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s
    cpus: 1.0
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    depends_on:
      - api
      - web
